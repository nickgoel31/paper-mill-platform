name: Deploy Solver Container to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'apps/solver/**'
      - '.github/workflows/deploy-solver.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Solver Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Solver Dependencies
        working-directory: apps/solver
        run: npm install

      - name: Deploy to Cloudflare Containers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/solver'
