#:schema node_modules/wrangler/config-schema.json
name = "paper-mill-platform"
account_id = "1b189b0a1970e13bd394d3d4584a83e4"
main = ".open-next/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Self-reference so OpenNext can revalidate `unstable_cache` / ISR entries in the
# background (stale-while-revalidate) instead of blocking the request that finds
# a stale entry. Service name must match `name` above.
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "paper-mill-platform"

# Cloudflare D1 Database Binding (5 GB Free Relational SQL)
[[d1_databases]]
binding = "DB"
database_name = "hra-papermill-db"
database_id = "63ae12d8-96ed-428f-a80f-f265ee2e9490"

# Cloudflare R2 Object Storage (10 GB Free, Zero Egress Fees)
[[r2_buckets]]
binding = "DOCUMENTS_BUCKET"
bucket_name = "hra-documents"

# Cloudflare Workers KV (1 GB Free In-Memory Cache)
[[kv_namespaces]]
binding = "ERP_KV"
id = "5cea5db459f94b3b80dbcc8124d25ac9"

# OpenNext incremental cache (Next.js unstable_cache / ISR) — backed by the same
# KV namespace, entries are namespaced under the `incremental-cache` prefix.
[[kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "5cea5db459f94b3b80dbcc8124d25ac9"

[vars]
NODE_ENV = "production"
SOLVER_SERVICE_URL = "https://hra-solver-worker.thewalkingjumbo.workers.dev"
AUTH_TRUST_HOST = "true"
AUTH_URL = "https://paper-mill-platform.thewalkingjumbo.workers.dev"
NEXTAUTH_URL = "https://paper-mill-platform.thewalkingjumbo.workers.dev"

